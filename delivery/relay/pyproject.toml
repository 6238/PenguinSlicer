[project]
name = "penguin-delivery-relay"
version = "1.0.0"
description = "Printer delivery's relay: holds jobs and the printer's last status, and pairs with a daemon"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "itsdangerous>=2.1,<3",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "penguin_delivery_relay"
module-root = ""
