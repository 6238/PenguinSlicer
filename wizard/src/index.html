<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="penguinslicer-version" content="__PENGUINSLICER_VERSION__">
<title>PenguinSlicer</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/wizard.css">
<script type="module" src="main.js"></script>
</head>
<body>
<!-- The panel: the mockup's markup (docs/mockups/print-wizard/index.html, version 8) from
     #wizard down, as far as the panel as a whole, the Settings step's and the Parts step's
     bodies and advanced mode; each other step's body comes with its step. The printer-status
     icon comes in phase 5. -->
<div id="wizard">
  <header id="wiz-header">
    <div class="brand-row">
      <div class="brand">PenguinSlicer</div>
    </div>
    <div class="config-info" id="config-info">
      <p class="config-status" id="config-status" hidden>Config: <span id="config-name"></span><a href="#" class="config-refresh" id="config-refresh" role="button" title="Reload the configuration" aria-label="Reload the configuration">↻</a></p>
    </div>
    <ol id="stepbar" aria-label="Steps">
      <li data-step="parts" data-num="1" class="active" role="button" tabindex="0" title="1. Parts" aria-label="Step 1: Parts"><span class="sn">Parts</span></li>
      <li data-step="settings" data-num="2" role="button" tabindex="0" title="2. Settings" aria-label="Step 2: Settings"><span class="sn">Settings</span></li>
      <li data-step="layout" data-num="3" role="button" tabindex="0" title="3. Layout" aria-label="Step 3: Layout"><span class="sn">Layout</span></li>
      <li data-step="preview" data-num="4" role="button" tabindex="0" title="4. Preview" aria-label="Step 4: Preview"><span class="sn">Preview</span></li>
      <li data-step="send" data-num="5" role="button" tabindex="0" title="5. Send" aria-label="Step 5: Send"><span class="sn">Send</span></li>
    </ol>
    <!-- the panel line: why a click on a tab was held, or that the server is slow -->
    <p id="step-why" class="step-why" role="status" hidden></p>
  </header>

  <main id="wiz-body">
    <div class="summary-wrap">
      <div id="wiz-summary" hidden aria-label="Plate summary"></div>
      <!-- the change details, joined to the "+2 changes" pill -->
      <div id="chg-pop" class="chg-pop" hidden></div>
    </div>
    <div id="notices" aria-live="polite"></div>

    <!-- the Settings step comes first in the markup, as in the mockup -->
    <section class="step" data-step="settings" hidden>
      <h2>Settings</h2>
      <div class="setup-grid">
        <label class="field"><span>Filament</span><select id="p-filament"></select></label>
        <label class="field"><span>Profile</span><select id="p-profile"></select></label>
      </div>
      <p class="caution" id="p-profile-clears" hidden></p>
      <fieldset class="field print-overrides" id="p-overrides" aria-label="Change for this print">
        <label><span>Infill</span><select id="ov-infill"></select></label>
        <label><span>Walls</span><select id="ov-walls"></select></label>
        <label><span>Supports</span><select id="ov-supports"></select></label>
        <label><span>Brim</span><select id="ov-brim"></select></label>
      </fieldset>
      <div class="adv-entry" id="adv-entry">
        <button type="button" class="btn small" id="btn-advanced">Advanced mode</button>
      </div>
      <div id="adv-effect" class="adv-effect" hidden></div>
    </section>
    <section class="step" data-step="parts">
      <h2>Parts</h2>
      <!-- outside Onshape: the upload area, binary STL only, and beside it the switch that says
           how the next files are read (designed in the guide); inside Onshape's panel, from
           phase 4, the mockup's #parts-onshape prompt in its place -->
      <div id="parts-upload">
        <div id="dropzone" tabindex="0" role="button">
          <p></p>
          <input type="file" id="f-upload" accept=".stl" multiple hidden>
        </div>
        <p class="hint upload-units" id="upload-units"></p>
      </div>
      <div id="parts-messages" aria-live="polite"></div>
      <ul id="parts-list" aria-live="polite"></ul>
      <p class="hint" id="parts-total"></p>
      <!-- New plate (designed in the guide) -->
      <div class="new-plate"><button type="button" class="btn small"></button></div>
    </section>
    <section class="step" data-step="layout" hidden>
      <h2>Layout</h2>
      <!-- the mockup's Layout step, filled by panel/layout-step.js: the toolbar with the list of
           gestures behind "?", the status line, the view and its buttons, the selection line and
           its link, the messages and the figures line -->
      <div id="layout-toolbar">
        <button type="button" class="btn small" id="btn-arrange"></button>
        <button type="button" class="btn small" id="btn-orient"></button>
        <span class="spacer"></span>
        <button type="button" class="icon-btn help-btn" id="btn-layout-help" aria-expanded="false" aria-controls="layout-help">?</button>
        <div id="layout-help" class="help-pop" role="dialog" hidden>
          <p id="layout-gestures"></p>
          <ul id="layout-more"></ul>
        </div>
      </div>
      <button type="button" id="layout-alert" class="layout-alert ok" disabled></button>
      <div id="layout-view" class="gl-view">
        <div class="view-btns" aria-label="View">
          <button type="button" id="btn-view"></button>
          <button type="button" id="btn-view-plate"></button>
          <button type="button" id="btn-top"></button>
        </div>
      </div>
      <div id="layout-selrow" class="layout-selrow">
        <div id="layout-selection" class="hint"></div>
      </div>
      <div id="layout-orient" class="layout-orient hint" hidden></div>
      <div id="layout-errors" aria-live="polite"></div>
      <p class="hint" id="layout-info"></p>
    </section>
    <section class="step" data-step="preview" hidden>
      <h2>Preview</h2>
      <!-- the mockup's slicing card, filled by panel/preview-step.js, without its Cancel slice (a
           slice is not cancelled by hand); the time line says "waited" while the slice waits -->
      <div id="slice-card" class="slice-card" hidden>
        <div class="slice-top">
          <svg id="slice-gauge" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
            <circle cx="32" cy="32" r="27" class="g-track"/>
            <circle cx="32" cy="32" r="27" class="g-fill" id="g-fill"/>
            <g class="g-layers" id="g-layers">
              <rect x="20" y="38" width="24" height="3" rx="1"/>
              <rect x="20" y="33" width="24" height="3" rx="1"/>
              <rect x="20" y="28" width="24" height="3" rx="1"/>
              <rect x="20" y="23" width="24" height="3" rx="1"/>
            </g>
          </svg>
          <div class="slice-text">
            <div class="slice-title"><span id="slice-pct"></span> <span id="slice-stage"></span></div>
            <div class="slice-times"><span id="slice-elapsed">0:00</span> <span class="slice-word"></span><span class="slice-sep"> &middot; </span><span id="slice-expected"></span></div>
            <div class="slice-bar"><div id="slice-bar-fill"></div></div>
          </div>
        </div>
        <ol id="slice-stages" class="slice-stages"></ol>
        <div id="slice-conn" class="conn" hidden></div>
        <div class="slice-actions"><span class="hint"></span></div>
      </div>
      <div id="preview-errors" aria-live="polite"></div>
      <!-- the result, filled by panel/preview-step.js: the print time and filament, the quiet line
           and the warnings, the layer preview (panel/layer-preview.js puts its canvas first in
           #viewer-container and its layer bar after the colour key), the readout with its two
           buttons, Reset view and the "?" -->
      <div id="preview-result" hidden>
        <div id="preview-stats" class="stats"></div>
        <ul class="result-warnings" hidden></ul>
        <div class="preview-view-message"></div>
        <div class="preview-cols">
          <div class="preview-view-box">
            <div id="viewer-container" class="gl-view">
              <button type="button" class="icon-btn key-btn" id="btn-key" aria-expanded="false" aria-controls="pv-key">
                <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="5" height="2.4" rx="1" fill="#2b5c9e"/><rect x="1" y="5.6" width="5" height="2.4" rx="1" fill="#e0912f"/><rect x="1" y="9.2" width="5" height="2.4" rx="1" fill="#2f9e7a"/><rect x="1" y="12.8" width="5" height="2.4" rx="1" fill="#9a8fb8"/><rect x="8" y="2.6" width="7" height="1.2" rx="0.6" fill="currentColor"/><rect x="8" y="6.2" width="7" height="1.2" rx="0.6" fill="currentColor"/><rect x="8" y="9.8" width="7" height="1.2" rx="0.6" fill="currentColor"/><rect x="8" y="13.4" width="7" height="1.2" rx="0.6" fill="currentColor"/></svg>
              </button>
              <ul id="pv-key" class="pv-key" hidden></ul>
            </div>
            <div class="layer-row">
              <button type="button" class="btn small icon" id="btn-layer-down" disabled>&minus;</button>
              <span id="layer-readout" class="hint" aria-live="polite"></span>
              <button type="button" class="btn small icon" id="btn-layer-up" disabled>+</button>
              <span class="spacer"></span>
              <button type="button" class="btn small" id="btn-preview-view" disabled></button>
              <button type="button" class="icon-btn help-btn" id="btn-preview-help" aria-expanded="false" aria-controls="preview-help">?</button>
              <div id="preview-help" class="help-pop up" role="dialog" hidden><p></p></div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="step" data-step="send" hidden>
      <h2>Send</h2>
      <!-- phase 2: the card of what will be printed, with no printer, filled by panel/send-step.js;
           the expired message in place of Send; a refused Download's message. The print card
           (#send-live) and the printer's messages come in phase 5. -->
      <div id="send-live"></div>
      <div class="send-cols">
        <div id="send-printer"></div>
        <div id="send-summary"></div>
      </div>
      <div id="send-errors" aria-live="polite"></div>
    </section>
  </main>

  <footer id="wiz-nav">
    <button type="button" id="btn-back" class="btn" disabled>Back</button>
    <button type="button" id="btn-next" class="btn primary" disabled>Next</button>
    <!-- phase 2: the Send step's one button; the printer's Send and its menu come in phase 5 -->
    <div id="final-action" class="split-btn" hidden>
      <button type="button" id="btn-do" class="btn primary" disabled>Download the sliced file</button>
    </div>
  </footer>

  <!-- advanced mode: fills the whole panel; the printer-status icon joins its name line in phase 5 -->
  <div id="advanced" class="advanced" hidden>
    <div class="brand-row adv-brand" id="adv-brand"><div class="brand">PenguinSlicer</div></div>
    <div class="adv-head">
      <div class="adv-title"><strong>Advanced mode</strong><span id="adv-sub"></span></div>
      <button type="button" class="btn small" id="adv-reset-all">Reset all</button>
    </div>
    <!-- below 480 px of panel an accordion of the sections; from 480 px a rail of sections -->
    <div class="adv-body" id="adv-body"></div>
    <div class="adv-foot"><button type="button" class="btn primary" id="adv-done">Back to Settings</button></div>
  </div>
</div>
</body>
</html>
