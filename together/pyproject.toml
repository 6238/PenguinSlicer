[project]
name = "penguin-together"
version = "0.1.0"
description = "The joined suite: the real front server and the real slice service run together on one machine."
readme = "README.md"
requires-python = ">=3.12"
# The suite reaches the components only through their start commands and their HTTP
# interfaces, so it depends on neither component's package: only on an HTTP client, and on
# Playwright for the browser tests, pinned to the wizard's own version so that both drive the
# one Chromium `make -C wizard install-browser` installs.
dependencies = [
    "httpx>=0.27",
    "playwright==1.65.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-randomly>=3.15",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joined"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider", "--strict-markers"]
# The hard limit for one test, from outside it. Each wait inside a test has its own,
# shorter backstop (joined.waits.BACKSTOP_S), which fails the test with what it waited for.
timeout = 180
timeout_method = "thread"
